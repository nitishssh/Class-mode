# ══════════════════════════════════════════════════════════════════
#  docker/docker-compose.yml — PersonalLearningPro (run from repo root with --project-directory .)
#
#  Unified orchestration for:
#    - EduAI (main web app + backend)       [default]
#    - IniClaw (agent gateway runtime)      [default]
#    - Nginx reverse proxy                  [--profile prod]
#    - Messaging: Astra DB cloud (cassandra-driver, no local container)
#    - All databases are remote: PostgreSQL + Astra DB cloud (no local DB containers)
#
#  Usage (from the repo root — paths inside resolve from --project-directory):
#    Development:  docker compose -f docker/docker-compose.yml --project-directory . up
#    Production:   docker compose -f docker/docker-compose.yml --project-directory . --profile prod up
#    (or simply: npm run db:up / db:down / db:reset)
# ══════════════════════════════════════════════════════════════════

name: personallearningpro

# ── Shared defaults ───────────────────────────────────────────────
x-app-base: &app-base
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - app-net
  security_opt:
    - no-new-privileges:true

x-healthcheck-http: &healthcheck-http
  test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-5001}/api/health"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 20s

# ── Services ──────────────────────────────────────────────────────
services:
  # ─────────────────────────────────────────────────────────────────
  # CORE SERVICES
  # ─────────────────────────────────────────────────────────────────

  # ── EduAI Main App (React + Express) ──────────────────────────────
  eduai-app:
    <<: *app-base
    build:
      context: .
      target: development
      dockerfile: docker/Dockerfile
      args:
        NODE_VERSION: "22-alpine"
    container_name: eduai-dev
    ports:
      - "${PORT:-5001}:5001"
    environment:
      NODE_ENV: development
      SERVICE_NAME: eduai-app
      INICLAW_GATEWAY_URL: http://iniclaw-gateway:4000
      MESSAGEPAL_PORT: 5002
    volumes:
      - ./client:/app/client
      - ./server:/app/server
      - ./shared:/app/shared
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.js:/app/postcss.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    healthcheck:
      <<: *healthcheck-http
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    profiles:
      - "" # default profile
      - dev

  # ── IniClaw Gateway (Agent Runtime) ──────────────────────────────
  iniclaw-gateway:
    <<: *app-base
    build:
      context: ./services/iniclaw
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22-alpine"
    container_name: iniclaw-gateway
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      SERVICE_NAME: iniclaw-gateway
      GATEWAY_PORT: 4000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      EDUAI_WEBHOOK_URL: http://eduai-app:5001/api/webhooks
      BRIDGE_SECRET: ${BRIDGE_SECRET:-bridge-secret-dev}
    volumes:
      - ./services/iniclaw:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - eduai-app
    profiles:
      - "" # default profile
      - dev

  # ─────────────────────────────────────────────────────────────────
  # LOCAL DATA LAYER (Layer 0 — reproducible local Postgres + Redis)
  #   Brought up by `npm run db:up` (docker compose up -d).
  #   App expects Postgres on 127.0.0.1:5432 and Redis on 127.0.0.1:6379.
  # ─────────────────────────────────────────────────────────────────

  # ── PostgreSQL (with pgvector for RAG) ───────────────────────────
  postgres:
    image: pgvector/pgvector:pg15
    container_name: classmode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: classmode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-classmode}
      POSTGRES_DB: classmode_dev
    ports:
      - "5432:5432"
    volumes:
      - classmode_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classmode -d classmode_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net
    security_opt:
      - no-new-privileges:true

  # ── Redis (sessions / cache / pub-sub) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: classmode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - classmode_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net
    security_opt:
      - no-new-privileges:true

  # ─────────────────────────────────────────────────────────────────
  # SUPPORTING SERVICES
  # ─────────────────────────────────────────────────────────────────

  # ── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: eduai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl:/etc/nginx/ssl:ro
    depends_on:
      - eduai-app
      - iniclaw-gateway
    networks:
      - app-net
    security_opt:
      - no-new-privileges:true
    profiles:
      - prod

  # ─────────────────────────────────────────────────────────────────
  # PRODUCTION SERVICES
  # ─────────────────────────────────────────────────────────────────

  # ── EduAI Production Build ───────────────────────────────────────
  eduai-app-prod:
    <<: *app-base
    build:
      context: .
      target: production
      dockerfile: docker/Dockerfile
      args:
        NODE_VERSION: "22-alpine"
    container_name: eduai-prod
    ports:
      - "${PORT:-5001}:5001"
    environment:
      NODE_ENV: production
      SERVICE_NAME: eduai-app
      INICLAW_GATEWAY_URL: http://iniclaw-gateway:4000
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    profiles:
      - prod

  # ── IniClaw Production Build ─────────────────────────────────────
  iniclaw-gateway-prod:
    <<: *app-base
    build:
      context: ./services/iniclaw
      target: production
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22-alpine"
    container_name: iniclaw-gateway-prod
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      SERVICE_NAME: iniclaw-gateway
      GATEWAY_PORT: 4000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      EDUAI_WEBHOOK_URL: http://eduai-app:5001/api/webhooks
      BRIDGE_SECRET: ${BRIDGE_SECRET}
    depends_on:
      - eduai-app-prod
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    profiles:
      - prod

# ── Networks ──────────────────────────────────────────────────────
networks:
  app-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

# ── Volumes ───────────────────────────────────────────────────────
volumes:
  classmode_postgres_data:
    name: classmode_postgres_data
  classmode_redis_data:
    name: classmode_redis_data
