# ══════════════════════════════════════════════════════════════════
#  docker-compose.yml — PersonalLearningPro
#
#  Unified orchestration for:
#    - EduAI (main web app + backend)       [default]
#    - IniClaw (agent gateway runtime)      [default]
#    - Nginx reverse proxy                  [--profile prod]
#    - AI Classroom (iniclaw + study-arena) [--profile ai-classroom]
#    - Messaging: Astra DB cloud (cassandra-driver, no local container)
#    - All databases are remote: PostgreSQL + Astra DB cloud (no local DB containers)
#
#  Usage:
#    Development:  docker compose up
#    Production:   docker compose --profile prod up
# ══════════════════════════════════════════════════════════════════

name: personallearningpro

# ── Shared defaults ───────────────────────────────────────────────
x-app-base: &app-base
  env_file:
    - .env
  restart: unless-stopped
  networks:
    - app-net
  security_opt:
    - no-new-privileges:true

x-healthcheck-http: &healthcheck-http
  test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-5001}/api/health"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 20s

# ── Services ──────────────────────────────────────────────────────
services:
  # ─────────────────────────────────────────────────────────────────
  # CORE SERVICES
  # ─────────────────────────────────────────────────────────────────

  # ── EduAI Main App (React + Express) ──────────────────────────────
  eduai-app:
    <<: *app-base
    build:
      context: .
      target: development
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22-alpine"
    container_name: eduai-dev
    ports:
      - "${PORT:-5001}:5001"
    environment:
      NODE_ENV: development
      SERVICE_NAME: eduai-app
      INICLAW_GATEWAY_URL: http://iniclaw-gateway:4000
      MESSAGEPAL_PORT: 5002
    volumes:
      - ./client:/app/client
      - ./server:/app/server
      - ./shared:/app/shared
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.js:/app/postcss.config.js
      - ./tsconfig.json:/app/tsconfig.json
      - ./theme.json:/app/theme.json
      - /app/node_modules
    healthcheck:
      <<: *healthcheck-http
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    profiles:
      - "" # default profile
      - dev

  # ── IniClaw Gateway (Agent Runtime) ──────────────────────────────
  iniclaw-gateway:
    <<: *app-base
    build:
      context: ./services/iniclaw
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22-alpine"
    container_name: iniclaw-gateway
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      SERVICE_NAME: iniclaw-gateway
      GATEWAY_PORT: 4000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      EDUAI_WEBHOOK_URL: http://eduai-app:5001/api/webhooks
      BRIDGE_SECRET: ${BRIDGE_SECRET:-bridge-secret-dev}
    volumes:
      - ./services/iniclaw:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - eduai-app
    profiles:
      - "" # default profile
      - dev

  # ─────────────────────────────────────────────────────────────────
  # SUPPORTING SERVICES
  # ─────────────────────────────────────────────────────────────────

  # ── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: eduai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl:/etc/nginx/ssl:ro
    depends_on:
      - eduai-app
      - iniclaw-gateway
    networks:
      - app-net
    security_opt:
      - no-new-privileges:true
    profiles:
      - prod

  # ─────────────────────────────────────────────────────────────────
  # PRODUCTION SERVICES
  # ─────────────────────────────────────────────────────────────────

  # ── EduAI Production Build ───────────────────────────────────────
  eduai-app-prod:
    <<: *app-base
    build:
      context: .
      target: production
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22-alpine"
    container_name: eduai-prod
    ports:
      - "${PORT:-5001}:5001"
    environment:
      NODE_ENV: production
      SERVICE_NAME: eduai-app
      INICLAW_GATEWAY_URL: http://iniclaw-gateway:4000
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    profiles:
      - prod

  # ── IniClaw Production Build ─────────────────────────────────────
  iniclaw-gateway-prod:
    <<: *app-base
    build:
      context: ./services/iniclaw
      target: production
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22-alpine"
    container_name: iniclaw-gateway-prod
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      SERVICE_NAME: iniclaw-gateway
      GATEWAY_PORT: 4000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
      EDUAI_WEBHOOK_URL: http://eduai-app:5001/api/webhooks
      BRIDGE_SECRET: ${BRIDGE_SECRET}
    depends_on:
      - eduai-app-prod
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    profiles:
      - prod

  # ── AI Classroom Feature (opt-in: docker compose --profile ai-classroom up) ──
  iniclaw:
    build:
      context: ./features/ai-classroom/ini_claw
      dockerfile: Dockerfile
    ports:
      - "7070:7070"
    environment:
      - BRIDGE_SECRET=${BRIDGE_SECRET}
      - INICLAW_PORT=7070
    volumes:
      - ./features/ai-classroom/ini_claw/.classroom-cache:/app/.classroom-cache
    restart: always
    networks:
      - app-net
    security_opt:
      - no-new-privileges:true
    profiles:
      - ai-classroom

  study-arena:
    build:
      context: ./features/ai-classroom/studyArena
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - INICLAW_GATEWAY_URL=http://iniclaw:7070
      - BRIDGE_SECRET=${BRIDGE_SECRET}
      - USE_INICLAW=true
      - PORT=3000
    depends_on:
      - iniclaw
    restart: always
    networks:
      - app-net
    security_opt:
      - no-new-privileges:true
    profiles:
      - ai-classroom

# ── Networks ──────────────────────────────────────────────────────
networks:
  app-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

# ── Volumes ───────────────────────────────────────────────────────
volumes: {}
