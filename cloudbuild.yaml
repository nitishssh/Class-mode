steps:
  # ─── Build Docker Image ─────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "--build-arg"
      - "VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}"
      - "--build-arg"
      - "VITE_FIREBASE_PROJECT_ID=${PROJECT_ID}"
      - "--build-arg"
      - "VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}"
      - "--build-arg"
      - "VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}"
      - "--build-arg"
      - "VITE_FIREBASE_MEASUREMENT_ID=${_VITE_FIREBASE_MEASUREMENT_ID}"
      - "."

  # ─── Push Docker Image ──────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

  # ─── Deploy to Cloud Run ────────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}"
      - "--region"
      - "${_REGION}"
      - "--add-cloudsql-instances"
      - "${PROJECT_ID}:${_REGION}:${_CLOUDSQL_INSTANCE}"
      - "--set-secrets=POSTGRESQL_URL=POSTGRESQL_URL:latest,GOOGLE_API_KEY=GOOGLE_API_KEY:latest,FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest,SESSION_SECRET=SESSION_SECRET:latest,JWT_SECRET=JWT_SECRET:latest,REFRESH_SECRET=REFRESH_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY:latest,DAILY_API_KEY=DAILY_API_KEY:latest"
      - "--set-env-vars=GOOGLE_CLOUD_PROJECT=${PROJECT_ID},NODE_ENV=production,DNS_IPV4_FIRST=true"
      - "--port"
      - "5001"
      - "--memory"
      - "512Mi"
      - "--cpu"
      - "1"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "5"
      - "--concurrency"
      - "80"
      - "--timeout"
      - "60"
      - "--allow-unauthenticated"

  # ─── Ensure public access (org policy may block --allow-unauthenticated) ────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "${_SERVICE_NAME}"
      - "--region=${_REGION}"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

substitutions:
  _REGION: asia-south1
  _REPO_NAME: plp-repo
  _SERVICE_NAME: personallearningpro
  _CLOUDSQL_INSTANCE: plp-pg
  _TAG: latest # GitHub triggers override this with $SHORT_SHA
  # Firebase web config — not secret (client-side identifiers; security enforced by Firebase rules)
  _VITE_FIREBASE_API_KEY: "AIzaSyDwCDy2u1-iwU--COECVu9YVDvj6PmqebY"
  _VITE_FIREBASE_APP_ID: "1:114646596478:web:fb850aa52b8a3a1668d12f"
  _VITE_FIREBASE_MESSAGING_SENDER_ID: "114646596478"
  _VITE_FIREBASE_MEASUREMENT_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
