[extend]
useDefault = true

[allowlist]
description = "Allowlist for test fixtures and example config"
paths = [
  ".env.example",
  ".env.staging",
  '''.*\.test\.ts''',
  '''.*\.spec\.ts''',
]
regexes = [
  # Placeholder values that look like secrets but aren't
  '''your_openai_api_key''',
  '''your_.*_key''',
  '''changeme''',
  '''super_secret_jwt_key_learning_pro_123''',
  '''class-mode-secret-key''',
  '''sk_test_4eC39HqLyjWDarjtT1zdp7dc''',
  # `hashicorp-tf-password` matches `password_secret_name = "ghcr-token"` in the
  # Container App registry blocks. That attribute is the azurerm provider's
  # pointer to a `secret` block by NAME — it cannot hold a value, by schema. The
  # credential it points at is `var.ghcr_token` (sensitive = true, supplied via
  # TF_VAR_ghcr_token and never written to a file). Anchored so it allowlists the
  # literal identifier only, not a real GHCR PAT, which is `ghp_`/`github_pat_`.
  # Already present at terraform-azure/main.tf:175; studio.tf is the second use.
  #
  # The quotes are part of the captured secret, not decoration: gitleaks 8.24.3
  # reports this finding with entropy 3.418296, which is Shannon entropy for the
  # 12-character `"ghcr-token"` and not for the 10-character bare identifier
  # (3.321928). An allowlist anchored on the bare form therefore never matches.
  # Optional quotes keep the anchors, so this still cannot match a longer secret
  # that merely contains the identifier.
  '''^"?ghcr-token"?$''',
]
