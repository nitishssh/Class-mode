name: study-arena
description: Network policy for IniClaw gateway — LLM providers used by PersonalLearningPro Study Arena
version: 3

network_policies:
  - host: api.openai.com
    port: 443
    reason: GPT inference (OpenAI API)
  - host: generativelanguage.googleapis.com
    port: 443
    reason: Gemini inference (Google AI API)
  - host: api.anthropic.com
    port: 443
    reason: Claude inference (Anthropic API)

filesystem_policies:
  - path: .classroom-cache
    mode: rw
    reason: Audit log and classroom generation artifacts
