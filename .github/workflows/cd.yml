name: Continuous Deployment

on:
  push:
    branches: ["main"]
    # Documentation cannot reach the deployed artifact: the runtime stage of
    # docker/Dockerfile copies only dist/, package*.json and pg-schema.sql, so a
    # markdown-only commit would rebuild the image and redeploy Azure to ship a
    # byte-identical container. docs/** already has its own workflow
    # (sync-docs-to-wiki), which still fires because paths-ignore here does not
    # affect it.
    #
    # GitHub skips the run only when EVERY changed file matches. A commit that
    # touches README.md and a route still deploys, which is the behaviour we
    # want — this narrows the trigger, it does not let code changes through.
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nitishssh/personallearningpro/personallearningpro
  AZURE_RESOURCE_GROUP: classmode-rg
  AZURE_CONTAINERAPP: classmode-app

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # required for OIDC
      security-events: write # required for Trivy SARIF upload

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate lockfile before deployment
        run: |
          npm install --package-lock-only --dry-run
          if ! git diff --exit-code package-lock.json; then
            echo "❌ Deployment blocked: package-lock.json is out of sync"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          trivyignores: config/trivyignore
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        continue-on-error: true
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  deploy-azure:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate to Azure (OIDC federated credential — no static keys)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.AZURE_CONTAINERAPP }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
