name: Continuous Integration

on:
  pull_request:
    branches: ["main"]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Validate lockfile sync
        run: |
          npm install --package-lock-only --dry-run
          if ! git diff --exit-code package-lock.json; then
            echo "❌ package-lock.json is out of sync with package.json"
            echo "Run 'npm install' locally and commit the updated lockfile"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check Types
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test

  e2e-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: classmode
          POSTGRES_PASSWORD: classmode
          POSTGRES_DB: classmode_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classmode -d classmode_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: development
      POSTGRESQL_URL: postgresql://classmode:classmode@localhost:5432/classmode_dev
      ENABLE_LOCAL_PASSWORD_AUTH: "true"
      SESSION_SECRET: ci-e2e-session-secret-not-for-production-use-000000
      JWT_SECRET: ci-e2e-jwt-secret-not-for-production-use-0000000000000
      REFRESH_SECRET: ci-e2e-refresh-secret-not-for-production-use-00000
      APP_URL: http://localhost:5001

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Apply database schema
        run: npm run migrate

      - name: Seed fixed-credential E2E test accounts
        run: npx tsx scripts/seed-e2e-test-accounts.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Test Docker Development Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: development
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Production Build
        id: docker-prod
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: false
          load: true
          tags: plp-prod-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: plp-prod-test:ci
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          # Report-only: surface CRITICAL/HIGH in the Security tab but don't hard-fail
          # CI on base-image OS CVEs (outside the app's control). Mirrors cd.yml.
          # App-dependency vulnerabilities are already gated by `npm audit` in build-and-test.
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        # Don't fail CI if code scanning isn't enabled on the repo; this is a
        # best-effort reporting step. Mirrors cd.yml.
        continue-on-error: true
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
