apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: personallearningpro-netpol
  namespace: personallearningpro
spec:
  podSelector:
    matchLabels:
      app: personallearningpro
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5001
  egress:
    # HTTPS/HTTP to external APIs (GCP, Firebase, Stripe, etc.)
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
    # MongoDB
    - ports:
        - port: 27017
          protocol: TCP
    # Redis
    - ports:
        - port: 6379
          protocol: TCP
    # Cassandra
    - ports:
        - port: 9042
          protocol: TCP
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
